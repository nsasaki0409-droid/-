<title>Azure Wyrm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=DotGothic16&display=swap">
<style>
/* Layout: one full-bleed flight screen; HUD drawn on a canvas above a low-res 3D view; HTML panels only for title and results. */
:root{
  --ink:#0d141c;
  --panel:rgba(13,20,28,.8);
  --sand:#f1dfb8;
  --sand-dim:#b9a684;
  --azure:#7fe9ff;
  --ember:#ff6a3d;
  --gold:#e2b450;
  --display:"Cinzel",Georgia,"Times New Roman",serif;
  --ui:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--sand)}
body{overflow:hidden;font-family:var(--ui)}
#stage{position:fixed;inset:0;background:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#stage[data-state="play"]{cursor:crosshair}
@media (pointer:fine){#stage[data-state="play"]{cursor:none}}
#gl,#hud{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{image-rendering:pixelated;image-rendering:crisp-edges}
#hud{pointer-events:none}
.rot{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
#stage:not([data-state="play"]) .rot{display:none}
.rot button{width:58px;height:58px;border-radius:50%;border:1.5px solid var(--azure);background:rgba(13,20,28,.55);color:var(--azure);font:1.25rem var(--ui);cursor:pointer;touch-action:none}
.rot button:active{background:rgba(127,233,255,.25)}
[hidden]{display:none!important}
.screen{position:absolute;inset:0;display:grid;place-items:center;padding:16px;overflow:auto;
  background:linear-gradient(to top,rgba(13,20,28,.92) 0%,rgba(13,20,28,.55) 45%,rgba(13,20,28,.05) 100%)}
.panel{width:100%;max-width:560px;display:flex;flex-direction:column;gap:18px;padding-block:24px}
.kicker{margin:0;color:var(--azure);letter-spacing:.45em;font-size:.95rem}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,10vw,4.6rem);line-height:1;letter-spacing:.1em;color:var(--sand);
  text-shadow:0 0 28px rgba(127,233,255,.35),0 3px 0 rgba(0,0,0,.35);text-wrap:balance}
.lede{margin:0;font-size:1.05rem;line-height:1.7;color:var(--sand);max-width:34em}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:.95rem;line-height:1.5}
dt{color:var(--gold);letter-spacing:.08em}
dd{margin:0;color:var(--sand);min-width:0}
.stats{font-size:1.1rem;font-variant-numeric:tabular-nums}
.stats dd{text-align:right}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.cta{font:1.2rem var(--ui);letter-spacing:.2em;padding:.75em 2.2em;border:none;background:var(--gold);color:var(--ink);cursor:pointer;
  clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.cta:hover{background:#f0c766}
.ghost{font:1rem var(--ui);letter-spacing:.15em;padding:.7em 1.4em;border:1px solid var(--sand-dim);background:transparent;color:var(--sand);cursor:pointer}
button:focus-visible{outline:2px solid var(--azure);outline-offset:3px}
.hint{margin:0;color:var(--sand-dim);font-size:.85rem;line-height:1.6}
.rank{font-family:var(--display);font-size:3.2rem;color:var(--gold);line-height:1}
</style>

<div id="stage" data-state="title">
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>
  <div class="rot">
    <button id="rotL" type="button" aria-label="視点を左へ90度回転">◀</button>
    <button id="rotR" type="button" aria-label="視点を右へ90度回転">▶</button>
  </div>

  <section id="title" class="screen">
    <div class="panel">
      <p class="kicker">蒼竜騎行</p>
      <h1>AZURE WYRM</h1>
      <p class="lede">砂の海の上空。古代兵器の群れが四方から迫る。竜の背から撃ち落とし、空鯨オルドヴァを沈めよ。</p>
      <dl>
        <dt>照準</dt><dd>マウス移動 ／ 画面ドラッグ ／ WASD・矢印キー</dd>
        <dt>ショット</dt><dd>クリック ／ タップ ／ Space</dd>
        <dt>ロックオン</dt><dd>押し続けて照準でなぞると最大6発ロック。離すとホーミングレーザー</dd>
        <dt>旋回視点</dt><dd>Q・E キー ／ 右下の ◀ ▶ で90°ずつ。後ろからも来る</dd>
      </dl>
      <div class="actions"><button id="startBtn" class="cta" type="button">出撃する</button></div>
      <p class="hint">左下のレーダーで敵の方角を確認 ・ P 一時停止 ・ M 消音</p>
    </div>
  </section>

  <section id="result" class="screen" hidden>
    <div class="panel">
      <p class="kicker" id="resKicker">MISSION</p>
      <h1 id="resTitle">STAGE CLEAR</h1>
      <dl class="stats" id="resStats"></dl>
      <div class="actions">
        <button id="retryBtn" class="cta" type="button">再出撃</button>
        <button id="titleBtn" class="ghost" type="button">タイトルへ</button>
      </div>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const TAU = Math.PI * 2, V3 = THREE.Vector3;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrapA = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const angleOf = p => Math.atan2(p.x, -p.z);
let reduceMotion = false;
try { reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

const $ = id => document.getElementById(id);
const stage = $('stage'), glc = $('gl'), hud = $('hud'), hctx = hud.getContext('2d');
let W = innerWidth, H = innerHeight, DPR = 1;
const safe = { t: 0, b: 0 };
const probe = document.createElement('div');
probe.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';
document.body.appendChild(probe);

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
const scene = new THREE.Scene();
const FOGC = new THREE.Color(0xe4a670);
scene.fog = new THREE.Fog(FOGC, 70, 340);
renderer.setClearColor(FOGC);
const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 1000);

function resize() {
  W = stage.clientWidth || innerWidth; H = stage.clientHeight || innerHeight;
  DPR = Math.min(2, devicePixelRatio || 1);
  const s = Math.min(1, 900 / Math.max(W, H));
  renderer.setSize(Math.max(2, Math.round(W * s)), Math.max(2, Math.round(H * s)), false);
  hud.width = Math.round(W * DPR); hud.height = Math.round(H * DPR);
  camera.aspect = W / H; camera.fov = W / H < 1 ? 80 : 62; camera.updateProjectionMatrix();
  const cs = getComputedStyle(probe);
  safe.t = parseFloat(cs.paddingTop) || 0; safe.b = parseFloat(cs.paddingBottom) || 0;
}
addEventListener('resize', resize);

const sunDir = new V3(-0.45, 0.2, -1).normalize();
scene.add(new THREE.HemisphereLight(0xbfd4e6, 0xb07a4a, 0.85));
const sun = new THREE.DirectionalLight(0xffe2b0, 1.15);
sun.position.copy(sunDir).multiplyScalar(100); scene.add(sun);

// sky dome
const sky = new THREE.Mesh(new THREE.SphereGeometry(800, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    top: { value: new THREE.Color(0x1b3654) }, mid: { value: new THREE.Color(0x7c97a6) },
    hor: { value: FOGC.clone() }, sunDir: { value: sunDir }, sunCol: { value: new THREE.Color(0xfff2cf) }
  },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform vec3 top, mid, hor, sunCol, sunDir; varying vec3 vP;
    void main(){ float h = vP.y; vec3 c = mix(hor, mid, smoothstep(0.0, 0.22, h)); c = mix(c, top, smoothstep(0.22, 0.85, h));
      float s = max(dot(normalize(vP), sunDir), 0.0);
      c += sunCol * pow(s, 600.0) * 1.6 + vec3(1.0, 0.68, 0.38) * pow(s, 10.0) * 0.4;
      gl_FragColor = vec4(c, 1.0); }`
}));
scene.add(sky);

// dunes: periodic in z (period P) so the mesh can scroll and wrap seamlessly
const P = 100, GROUND_Y = -26;
function duneH(x, z) {
  const k = TAU / P;
  return Math.sin(x * 0.045 + Math.sin(z * k) * 1.2) * 4 + Math.sin(z * k * 2 + x * 0.02) * 2.5 + Math.sin(x * 0.11 - z * k * 3) * 1.2;
}
const groundGeo = new THREE.PlaneGeometry(900, 900, 90, 90); groundGeo.rotateX(-Math.PI / 2);
{
  const pos = groundGeo.attributes.position, cols = new Float32Array(pos.count * 3);
  const lo = new THREE.Color(0xa86c3e), hi = new THREE.Color(0xf0bd7c), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const h = duneH(pos.getX(i), pos.getZ(i)); pos.setY(i, h);
    c.copy(lo).lerp(hi, clamp((h + 7) / 14, 0, 1)); cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
  }
  groundGeo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  groundGeo.computeVertexNormals();
}
const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1, metalness: 0 }));
ground.position.y = GROUND_Y; scene.add(ground);

// ruins & rocks
const ruinMat = new THREE.MeshStandardMaterial({ color: 0xa27b5c, flatShading: true, roughness: .95 });
const ruinMat2 = new THREE.MeshStandardMaterial({ color: 0x7f6a5a, flatShading: true, roughness: .95 });
const rockMat = new THREE.MeshStandardMaterial({ color: 0x8c5a40, flatShading: true, roughness: 1 });
function makeRuin(kind) {
  const g = new THREE.Group();
  if (kind === 0) {
    const h = rand(18, 42), c = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 2.3, h, 7), ruinMat);
    c.position.y = h / 2; g.add(c);
    if (Math.random() < .6) { const cap = new THREE.Mesh(new THREE.BoxGeometry(5.6, 1.5, 5.6), ruinMat2); cap.position.y = h + .7; g.add(cap); }
    g.rotation.z = rand(-.18, .18);
  } else if (kind === 1) {
    const h = rand(16, 28), w = rand(10, 18);
    for (const s of [-1, 1]) { const p = new THREE.Mesh(new THREE.BoxGeometry(2.6, h, 2.6), ruinMat); p.position.set(s * w / 2, h / 2, 0); g.add(p); }
    const l = new THREE.Mesh(new THREE.BoxGeometry(w + 4, 2.4, 3.2), ruinMat2); l.position.y = h + 1.2; l.rotation.z = rand(-.08, .08); g.add(l);
  } else if (kind === 2) {
    const h = rand(30, 75), c = new THREE.Mesh(new THREE.CylinderGeometry(rand(.8, 3), rand(7, 11), h, 6), rockMat);
    c.position.y = h / 2; g.add(c);
  } else {
    const r = rand(3, 8), m = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 0), rockMat); m.scale.y = .6; g.add(m);
    const st = new THREE.Mesh(new THREE.ConeGeometry(r * .7, r * 2.2, 6), rockMat); st.rotation.x = Math.PI; st.position.y = -r * 1.3; g.add(st);
    g.userData.float = rand(18, 50);
  }
  return g;
}
const ruins = [];
function placeRuin(g, z) {
  const side = Math.random() < .5 ? -1 : 1;
  g.position.set(side * rand(22, 320), -30 + (g.userData.float || 0), z);
  g.rotation.y = rand(0, TAU);
}
for (let i = 0; i < 46; i++) {
  const g = makeRuin(i % 4 === 3 ? 3 : (i % 5 === 0 ? 1 : (i % 3 === 0 ? 2 : 0)));
  placeRuin(g, rand(-450, 450)); scene.add(g); ruins.push(g);
}

// streaming sand for a sense of speed
const DUSTN = 380, dustPos = new Float32Array(DUSTN * 3);
for (let i = 0; i < DUSTN; i++) { dustPos[i * 3] = rand(-70, 70); dustPos[i * 3 + 1] = rand(-22, 26); dustPos[i * 3 + 2] = rand(-160, 160); }
const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xfbe6c2, size: .28, transparent: true, opacity: .55, depthWrite: false }));
dust.frustumCulled = false; scene.add(dust);

// ---------- dragon ----------
function bone(a, b, r, mat) {
  const va = new V3(...a), vb = new V3(...b), len = va.distanceTo(vb);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r * .6, r, len, 5), mat);
  m.position.copy(va).add(vb).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new V3(0, 1, 0), vb.clone().sub(va).normalize());
  return m;
}
function makeDragon() {
  const g = new THREE.Group(), vis = new THREE.Group(); g.add(vis);
  const armor = new THREE.MeshStandardMaterial({ color: 0x2c5fa6, flatShading: true, metalness: .35, roughness: .45 });
  const belly = new THREE.MeshStandardMaterial({ color: 0xcab68a, flatShading: true, roughness: .8 });
  const gold = new THREE.MeshStandardMaterial({ color: 0xd8aa48, flatShading: true, metalness: .8, roughness: .3 });
  const memb = new THREE.MeshStandardMaterial({ color: 0x5b8fcc, flatShading: true, side: THREE.DoubleSide, roughness: .7, metalness: .1 });
  const cloth = new THREE.MeshStandardMaterial({ color: 0x8e2f2a, flatShading: true, roughness: .9 });
  const body = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), armor); body.scale.set(.95, .8, 2.2); vis.add(body);
  const bel = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), belly); bel.scale.set(.8, .6, 1.9); bel.position.y = -.28; vis.add(bel);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(.32, .56, 2.0, 7), armor); neck.position.set(0, .75, -2.4); neck.rotation.x = -1.0; vis.add(neck);
  const head = new THREE.Group(); head.position.set(0, 1.35, -3.35); vis.add(head);
  head.add(new THREE.Mesh(new THREE.BoxGeometry(.75, .55, 1.0), armor));
  const snout = new THREE.Mesh(new THREE.ConeGeometry(.34, 1.2, 6), armor); snout.rotation.x = -Math.PI / 2; snout.position.set(0, -.08, -1.0); head.add(snout);
  const jaw = new THREE.Mesh(new THREE.ConeGeometry(.24, 1.0, 5), belly); jaw.rotation.x = -Math.PI / 2; jaw.position.set(0, -.3, -.8); head.add(jaw);
  const eyeM = new THREE.MeshBasicMaterial({ color: 0xfff27a });
  for (const s of [-1, 1]) {
    const horn = new THREE.Mesh(new THREE.ConeGeometry(.1, 1.15, 5), gold); horn.position.set(s * .28, .35, .35); horn.rotation.set(1.05, 0, -s * .25); head.add(horn);
    const eye = new THREE.Mesh(new THREE.BoxGeometry(.1, .08, .2), eyeM); eye.position.set(s * .36, .1, -.3); head.add(eye);
  }
  for (let i = 0; i < 5; i++) { const sp = new THREE.Mesh(new THREE.ConeGeometry(.14, .6, 4), gold); sp.position.set(0, .72, -1.4 + i * .7); sp.rotation.x = .6; vis.add(sp); }
  // wings
  const A = [0, 0, -.9], B = [0, 0, 1.1], C = [-2.6, .5, -.7], D = [-5.8, .3, .3], E = [-3.8, 0, 1.8], F = [-1.6, 0, 1.6];
  const wg = new THREE.BufferGeometry();
  wg.setAttribute('position', new THREE.Float32BufferAttribute([A, C, F, A, F, B, C, D, E, C, E, F].flat(), 3)); wg.computeVertexNormals();
  const wings = [];
  for (const s of [-1, 1]) {
    const piv = new THREE.Group(); piv.position.set(s * .7, .45, -.4); piv.scale.x = -s;
    piv.add(new THREE.Mesh(wg, memb)); piv.add(bone(A, C, .14, armor)); piv.add(bone(C, D, .1, gold)); piv.add(bone(C, E, .06, armor));
    vis.add(piv); wings.push({ piv, s });
  }
  // tail
  const tail = [];
  for (let i = 0; i < 8; i++) {
    const r = .5 - i * .055, seg = new THREE.Mesh(new THREE.ConeGeometry(r, 1.0, 6), i % 2 ? armor : belly);
    seg.rotation.x = Math.PI / 2; vis.add(seg); tail.push(seg);
  }
  const blade = new THREE.Mesh(new THREE.ConeGeometry(.3, .9, 4), gold); blade.rotation.x = Math.PI / 2; blade.scale.x = .3; vis.add(blade); tail.push(blade);
  // rider
  const rider = new THREE.Group(); rider.position.set(0, .82, -.85); vis.add(rider);
  const saddle = new THREE.Mesh(new THREE.BoxGeometry(.7, .2, .9), gold); rider.add(saddle);
  const torso = new THREE.Mesh(new THREE.BoxGeometry(.42, .58, .3), cloth); torso.position.y = .42; rider.add(torso);
  const helm = new THREE.Mesh(new THREE.SphereGeometry(.2, 7, 6), new THREE.MeshStandardMaterial({ color: 0xd9c7a0, flatShading: true, roughness: .6 })); helm.position.y = .85; rider.add(helm);
  const visor = new THREE.Mesh(new THREE.BoxGeometry(.3, .07, .08), eyeM); visor.position.set(0, .86, -.18); rider.add(visor);
  const gun = new THREE.Mesh(new THREE.CylinderGeometry(.05, .07, 1.2, 6), gold); gun.rotation.x = Math.PI / 2; gun.position.set(.22, .5, -.5); rider.add(gun);
  const scarf = new THREE.Mesh(new THREE.PlaneGeometry(.18, 1.1), new THREE.MeshStandardMaterial({ color: 0xc8423a, side: THREE.DoubleSide, flatShading: true }));
  scarf.position.set(0, .7, .55); scarf.rotation.x = -1.2; rider.add(scarf);
  g.scale.setScalar(.62);
  return { group: g, vis, head, wings, tail, rider, scarf };
}
const dragon = makeDragon(); scene.add(dragon.group);

// ---------- shared enemy assets ----------
const GEO = {
  oct: new THREE.OctahedronGeometry(1, 0), blade: new THREE.BoxGeometry(2.4, .1, .7), eye: new THREE.SphereGeometry(.3, 6, 5),
  orbIn: new THREE.SphereGeometry(.38, 8, 6), orbOut: new THREE.SphereGeometry(.78, 8, 6),
  shot: new THREE.BoxGeometry(.16, .16, 2.4), laserHead: new THREE.SphereGeometry(.38, 6, 5), flash: new THREE.SphereGeometry(1, 10, 8)
};
const add = THREE.AdditiveBlending;
const MAT = {
  bone: new THREE.MeshStandardMaterial({ color: 0xdccdb0, flatShading: true, roughness: .6 }),
  bronze: new THREE.MeshStandardMaterial({ color: 0x6e4b35, flatShading: true, metalness: .6, roughness: .4 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x3a2c2a, flatShading: true, roughness: .7 }),
  shell: new THREE.MeshStandardMaterial({ color: 0xc9a24a, flatShading: true, metalness: .85, roughness: .3 }),
  eye: new THREE.MeshBasicMaterial({ color: 0xff3b2f }),
  glow: new THREE.MeshBasicMaterial({ color: 0xffa040 }),
  core: new THREE.MeshBasicMaterial({ color: 0xff2a4a }),
  orbIn: new THREE.MeshBasicMaterial({ color: 0xffe0f2 }),
  orbOut: new THREE.MeshBasicMaterial({ color: 0xff3fa0, transparent: true, opacity: .55, blending: add, depthWrite: false }),
  shot: new THREE.MeshBasicMaterial({ color: 0xffe27a, transparent: true, blending: add, depthWrite: false }),
  laserHead: new THREE.MeshBasicMaterial({ color: 0xc8fbff, transparent: true, blending: add, depthWrite: false }),
  laserLine: new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: add, depthWrite: false })
};

function makeDrone() {
  const g = new THREE.Group(), b = new THREE.Mesh(GEO.oct, MAT.bone); b.scale.set(1, .6, 1.5); g.add(b);
  const wings = [];
  for (const s of [-1, 1]) { const w = new THREE.Mesh(GEO.blade, MAT.bronze); w.position.set(s * 1.4, .1, -.2); w.rotation.y = s * .3; g.add(w); wings.push(w); }
  const e = new THREE.Mesh(GEO.eye, MAT.eye); e.position.z = 1.25; g.add(e);
  g.userData.wings = wings; return g;
}
function makeGunship() {
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.5, 4.6, 8), MAT.bronze); hull.rotation.x = Math.PI / 2; g.add(hull);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(1.0, 1.6, 8), MAT.bone); nose.rotation.x = Math.PI / 2; nose.position.z = 3.1; g.add(nose);
  const fin = new THREE.Mesh(new THREE.BoxGeometry(6, .14, 1.5), MAT.bone); fin.position.z = -1; g.add(fin);
  const dors = new THREE.Mesh(new THREE.BoxGeometry(.14, 1.8, 1.8), MAT.bone); dors.position.set(0, 1.3, -1.2); g.add(dors);
  for (const s of [-1, 1]) { const pod = new THREE.Mesh(new THREE.SphereGeometry(.65, 7, 6), MAT.glow); pod.position.set(s * 3, 0, -1); g.add(pod); }
  const e = new THREE.Mesh(GEO.eye, MAT.eye); e.scale.setScalar(1.6); e.position.z = 3.8; g.add(e);
  g.scale.setScalar(1.1); return g;
}
function makeStinger() {
  const g = new THREE.Group(), c = new THREE.Mesh(new THREE.ConeGeometry(.6, 2.9, 5), MAT.bone); c.rotation.x = Math.PI / 2; g.add(c);
  for (const s of [-1, 1]) { const sp = new THREE.Mesh(new THREE.ConeGeometry(.18, 1.6, 4), MAT.bronze); sp.rotation.set(Math.PI / 2, 0, s * .9); sp.position.set(s * .6, 0, -.5); g.add(sp); }
  const t = new THREE.Mesh(GEO.eye, MAT.glow); t.position.z = -1.5; g.add(t);
  return g;
}

// ---------- particles & flashes ----------
const PN = 2400, pPos = new Float32Array(PN * 3), pCol = new Float32Array(PN * 3), pVel = new Float32Array(PN * 3), pBase = new Float32Array(PN * 3);
const pLife = new Float32Array(PN), pMax = new Float32Array(PN); let pHead = 0;
for (let i = 0; i < PN; i++) pPos[i * 3 + 1] = -9999;

// ---------- update ----------

  G.camA += (G.camAT - G.camA) * Math.min(1, dt * 7);

    const k = input.keys, sp = 1.7 * dt;

  sm.x += (ret.x - sm.x) * Math.min(1, dt * 4); sm.y += (ret.y - sm.y) * Math.min(1, dt * 4);

  // dragon
  const a = G.camA, p = dragon.group.position;
  camRight(a, _r); camDir(a, _d);
  p.set(_r.x * sm.x * 4.5, sm.y * 2.6 + Math.sin(G.t * 2.1) * .25, _r.z * sm.x * 4.5);
  dragon.vis.rotation.z = -p.x / 4.5 * .4; dragon.vis.rotation.x = sm.y * .12;
  const flap = Math.sin(G.t * 4.2) * .55 + .12;
  for (const w of dragon.wings) w.piv.rotation.z = -w.s * flap;
  dragon.tail.forEach((s, i) => s.position.set(Math.sin(G.t * 1.7 - i * .5) * .06 * i, -.1 + Math.sin(G.t * 3 - i * .7) * .07 * i, 2.1 + i * .72));

  dragon.scarf.rotation.z = Math.sin(G.t * 9) * .3;
  dragon.head.rotation.x = Math.sin(G.t * 2.1 + 1) * .06;
  dragon.vis.visible = !(G.inv > 0 && Math.floor(G.t * 20) % 2 === 0);

  // camera

  _look.copy(_base).addScaledVector(_d, 30); _look.y += 1.0;
  if (G.shake > 0 && !reduceMotion) { camera.position.x += rand(-1, 1) * G.shake * .7; camera.position.y += rand(-1, 1) * G.shake * .7; }

  const active = G.state === 'play' || G.state === 'dead' || G.state === 'clearing';
  if (active) {

      while (G.tl < TIMELINE.length && G.stageT >= TIMELINE[G.tl][0]) TIMELINE[G.tl++][1]();
      for (let i = pending.length - 1; i >= 0; i--) if (G.stageT >= pending[i].t) { const f = pending[i].fn; pending.splice(i, 1); f(); }
    }

      e.t += dt;

      } else if (e.type === 'stinger') {

        if (Math.abs(e.wp.z) > 260) { e.dead = true; scene.remove(e.mesh); continue; }
      } else { e.mesh.getWorldPosition(e.wp); }
      if (e.pop > 0) { e.pop = Math.max(0, e.pop - dt); const s = 1 + e.pop * 1.4; e.mesh.scale.setScalar((e.type === 'gunship' ? 1.1 : 1) * s); }

      }

      }

    }

}

// ---------- flow ----------
function clearWorld() {

  if (boss) scene.remove(boss.group);
  for (const o of orbs) scene.remove(o.mesh);
  for (const s of shots) scene.remove(s.mesh);
  for (const L of lasers) if (!L.dead) removeLaser(L);
  enemies.length = orbs.length = shots.length = lasers.length = pending.length = popups.length = msgs.length = 0;
  locks = []; boss = null;
}

  if (win) rows.push(['残り体力ボーナス', `+${bonus.toLocaleString()}`], ['合計', total.toLocaleString()]);
  const dl = $('resStats'); dl.innerHTML = '';
  for (const [k, v] of rows) { const dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = k; dd.textContent = v; dl.append(dt, dd); }
  if (win) { const dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = '評価'; dd.innerHTML = `<span class="rank">${rank}</span>`; dl.append(dt, dd); }
  $('result').hidden = false; setTimeout(() => $('retryBtn').focus(), 50);
}
function toTitle() {
  clearWorld(); G.state = 'title'; stage.dataset.state = 'title';
  $('result').hidden = true; $('title').hidden = false; dragon.group.visible = true; G.hp = 100;
}
function rotateView(d) { if (G.state !== 'play' || G.paused) return; G.view += d; G.camAT = G.view * H90; sfx.whoosh(); }

// ---------- input ----------
function setRetFromClient(x, y) {
  const r = stage.getBoundingClientRect();
  ret.x = clamp(((x - r.left) / r.width) * 2 - 1, -.96, .96); ret.y = clamp(1 - ((y - r.top) / r.height) * 2, -.94, .94);
}
function pressStart() { if (G.state !== 'play' || G.paused) return; input.down = true; input.hold = 0; input.scanCd = 0; fireShot(); }
function pressEnd() { if (!input.down) return; input.down = false; if (input.lockMode) releaseLocks(); input.lockMode = false; }
stage.addEventListener('pointerdown', e => {
  if (G.state !== 'play' || e.target.closest('button')) return;
  e.preventDefault(); input.ptr = e.pointerType; input.lx = e.clientX; input.ly = e.clientY;
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  if (e.pointerType === 'mouse') setRetFromClient(e.clientX, e.clientY);
  pressStart();
});
stage.addEventListener('pointermove', e => {
  if (G.state !== 'play') return;
  if (e.pointerType === 'mouse') setRetFromClient(e.clientX, e.clientY);
  else if (input.down) {
    ret.x += (e.clientX - input.lx) / W * 3; ret.y -= (e.clientY - input.ly) / H * 3;
    input.lx = e.clientX; input.ly = e.clientY;
  }
});
stage.addEventListener('pointerup', e => { if (!e.target.closest || !e.target.closest('button')) pressEnd(); });
stage.addEventListener('pointercancel', pressEnd);
stage.addEventListener('contextmenu', e => e.preventDefault());
for (const [id, d] of [['rotL', -1], ['rotR', 1]]) {
  $(id).addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); rotateView(d); });
  $(id).addEventListener('click', e => { if (e.detail === 0) rotateView(d); });
}
addEventListener('keydown', e => {
  if (G.state !== 'play') return;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  input.keys[e.code] = true;
  if (e.code === 'Space') pressStart();
  if (e.code === 'KeyQ') rotateView(-1);
  if (e.code === 'KeyE') rotateView(1);
  if (e.code === 'KeyP') { G.paused = !G.paused; pressEnd(); }
  if (e.code === 'KeyM') muted = !muted;
});
addEventListener('keyup', e => { input.keys[e.code] = false; if (e.code === 'Space') pressEnd(); });
addEventListener('blur', () => { input.keys = {}; pressEnd(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') { G.paused = true; pressEnd(); } });
$('startBtn').addEventListener('click', e => { e.currentTarget.blur(); startGame(); });
$('retryBtn').addEventListener('click', e => { e.currentTarget.blur(); startGame(); });
$('titleBtn').addEventListener('click', toTitle);

// ---------- loop ----------
resize();
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = G.paused ? 0 : Math.min(.05, (now - last) / 1000); last = now;
  if (!G.paused) update(dt);
  renderer.render(scene, camera);
  drawHUD();
}
update(0.016);
requestAnimationFrame(frame);
})();
</script>
